name: Apply portal SEO and neutral issue wording

on:
  push:
    paths:
      - '.github/workflows/site-seo-wording.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SEO and portal wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          app = root / 'assets/js/app.js'

          html = index.read_text(encoding='utf-8')

          # Stronger search title/description while keeping the portal independent/non-official.
          html = re.sub(
              r'<title>.*?</title>',
              '<title>धौरहरा आबादकारी ग्राम पंचायत | विकास कार्य, प्रधान इतिहास, विद्यालय व जनसमस्या पोर्टल</title>',
              html,
              count=1,
              flags=re.S,
          )
          html = re.sub(
              r'<meta\s+name="description"\s+content="[^"]*"\s*/?>',
              '<meta name="description" content="धौरहरा आबादकारी, ब्लॉक विशुनपुरा, कुशीनगर का स्वतंत्र ग्राम जनसूचना पोर्टल — ग्राम पंचायत कार्यक्षेत्र, प्रधान इतिहास, विकास कार्य, विद्यालय, योजनाएँ और जनसमस्या ट्रैकिंग।">',
              html,
              count=1,
              flags=re.I,
          )

          if 'rel="canonical"' not in html:
              seo = r'''
  <link rel="canonical" href="https://dhaurahra.itdelhi.in/">
  <link rel="alternate" hreflang="hi-IN" href="https://dhaurahra.itdelhi.in/">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="author" content="Dhaurahara Abadkari Gram Jan Suchna Portal">
  <meta name="geo.region" content="IN-UP">
  <meta name="geo.placename" content="Dhaurahara Abadkari, Kushinagar, Uttar Pradesh">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="hi_IN">
  <meta property="og:site_name" content="धौरहरा आबादकारी ग्राम जनसूचना पोर्टल">
  <meta property="og:title" content="धौरहरा आबादकारी ग्राम पंचायत | विकास और जनसूचना पोर्टल">
  <meta property="og:description" content="ग्राम पंचायत कार्यक्षेत्र, प्रधान इतिहास, सत्यापित विकास कार्य, विद्यालय जानकारी और जनसमस्या ट्रैकिंग — धौरहरा आबादकारी, कुशीनगर।">
  <meta property="og:url" content="https://dhaurahra.itdelhi.in/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="धौरहरा आबादकारी ग्राम पंचायत | जनसूचना पोर्टल">
  <meta name="twitter:description" content="विकास कार्य, प्रधान इतिहास, विद्यालय, पंचायत जानकारी और जनसमस्या ट्रैकिंग।">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "धौरहरा आबादकारी ग्राम जनसूचना पोर्टल",
    "alternateName": "Dhaurahara Abadkari Gram Jan Suchna Portal",
    "url": "https://dhaurahra.itdelhi.in/",
    "description": "धौरहरा आबादकारी, ब्लॉक विशुनपुरा, कुशीनगर का स्वतंत्र ग्राम जनसूचना पोर्टल।",
    "inLanguage": "hi-IN",
    "about": {
      "@type": "Place",
      "name": "धौरहरा आबादकारी",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Padrauna",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      }
    }
  }
  </script>
'''
              html = html.replace('</head>', seo + '\n</head>', 1)

          replacements = {
              'शिकायत ट्रैक करें': 'समस्या ट्रैक करें',
              'लंबित शिकायतें': 'प्रकाशित जनसमस्याएँ',
              'Admin approved': 'सत्यापित/प्रकाशित रिकॉर्ड',
              'शिकायत सफलतापूर्वक दर्ज हुई': 'समस्या सफलतापूर्वक दर्ज हुई',
              'शिकायत की स्थिति': 'समस्या की स्थिति',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          index.write_text(html, encoding='utf-8')

          js = app.read_text(encoding='utf-8')

          # User-facing wording: portal records/tracks issues; it does not claim to resolve them itself.
          for old, new in {
              'शिकायत प्राप्त हुई': 'समस्या प्राप्त हुई',
              'शिकायत तैयार की जा रही है…': 'समस्या तैयार की जा रही है…',
              'शिकायत सुरक्षित रूप से भेजी जा रही है…': 'समस्या सुरक्षित रूप से भेजी जा रही है…',
              '✅ शिकायत दर्ज हो गई। Reference:': '✅ समस्या दर्ज हो गई। Reference:',
              'शिकायत की स्थिति': 'समस्या की स्थिति',
          }.items():
              js = js.replace(old, new)

          if 'function issueStatusLabel(' not in js:
              status_fn = '''\nfunction issueStatusLabel(status){\n  const raw=String(status||\"\").trim();\n  const map={\n    \"Pending Verification\":\"सत्यापन लंबित\",\n    \"Approved\":\"सत्यापित\",\n    \"Open\":\"सत्यापित / कार्यवाही अपेक्षित\",\n    \"Under Verification\":\"सत्यापन लंबित\",\n    \"In Progress\":\"कार्यवाही प्रगति पर\",\n    \"Resolved\":\"निस्तारण की सूचना प्राप्त\",\n    \"Rejected\":\"रिकॉर्ड बंद\"\n  };\n  return map[raw]||raw||\"सत्यापन लंबित\";\n}\n\nfunction injectPortalRoleNotice(){\n  const form=qs(\"#issueForm\");\n  if(!form||qs(\"#portalRoleNotice\")) return;\n  const note=document.createElement(\"div\");\n  note.id=\"portalRoleNotice\";\n  note.className=\"scope-note\";\n  note.innerHTML=\"<b>पोर्टल की भूमिका:</b> यह पोर्टल समस्या का समाधान स्वयं नहीं करता। इसका उद्देश्य जनसमस्या को दर्ज करना, सत्यापित जानकारी दिखाना और संबंधित पंचायत/विभाग की कार्यवाही की स्थिति पारदर्शी रूप से प्रदर्शित करना है।\";\n  form.parentNode.insertBefore(note,form);\n}\n'''
              marker = 'let submissionTimer=null,schoolCache=[];'
              if marker in js:
                  js = js.replace(marker, marker + status_fn, 1)
              else:
                  js = status_fn + js

          # Apply neutral public labels to issue and school issue statuses.
          js = js.replace('esc(d.status)', 'esc(issueStatusLabel(d.status))')
          js = js.replace('esc(i.status)', 'esc(issueStatusLabel(i.status))')

          if 'injectSchoolUI();injectPortalRoleNotice();' not in js:
              js = js.replace('injectSchoolUI();', 'injectSchoolUI();injectPortalRoleNotice();', 1)

          app.write_text(js, encoding='utf-8')
          PY

      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/app.js
          git commit -m "Improve SEO and clarify public issue tracking wording"
          git push
